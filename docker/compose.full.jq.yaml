volumes:
  hatchet_certs:
    name: hatchet_certs
  hatchet_config:
    name: hatchet_config
  hatchet_api_key:
    name: hatchet_api_key
  hatchet_rabbitmq_data:
    name: hatchet_rabbitmq_data
  hatchet_rabbitmq_conf:
    name: hatchet_rabbitmq_conf
  hatchet_postgres_data2:
    name: hatchet_postgres_data
  minio_data:
    name: minio_data
  postgres_data2:
    name: postgres_data

services:
  # Redis 缓存服务
  redis:
    image: registry.ap-southeast-1.aliyuncs.com/fastbuildai/redis:8.0.2
    container_name: fastbuildai-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUICK_START_MODE: ${QUICK_START_MODE:-false}
    ports:
    - "32768:6379"
    #   - "${REDIS_EXTERNAL_PORT}${REDIS_EXTERNAL_PORT:+:}6379"
    volumes:
      - ./data/redis:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# # pg数据库目录挂载
# # 确保目录存在
# mkdir -p /data/pg_all_data/pgdata
# mkdir -p /data/pg_all_data/polardb-data

# # 设置权限（你已执行，再次确认）
# chown -R 999:999 /data/pg_all_data/pgdata
# chown -R 999:999 /data/pg_all_data/polardb-data
  postgres:
    image: polardb15_vector_age_zh:v1.2  # 注意：实际镜像名不是官方的 polardb/polardb_pg_local_instance:15，而是你本地构建的
    container_name: postgres_polardb15_vector_age_zh
    environment:
      POLARDB_PORT: "5432"
      POLARDB_USER: langchain
      POLARDB_PASSWORD: langchain
      POLARDB_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=zh_CN.utf8 --lc-collate=zh_CN.utf8 --lc-ctype=zh_CN.utf8 --encoding=UTF8"
      TZ: Asia/Shanghai
      PGHOST: 127.0.0.1
      # 其他环境变量如 PATH、LANG 等通常由镜像默认设置，无需显式声明
    ports:
      - "7000:5432"  # Host:Container
    cap_add:
      - SYS_PTRACE
    privileged: true
    security_opt:
      - label=disable
    volumes:
      - /data/pg_all_data/pgdata:/var/lib/postgresql/data  # bind mount for PG data
      - /data/pg_all_data/polardb-data:/var/polardb        # bind mount for PolarDB internal data
    working_dir: /home/postgres/
    user: postgres
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["postgres"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # PolarDB 启动较慢，建议增加启动等待时间

  jqai:
    image: jqai:v1.0.1
    container_name: jqai_compose
    ports:
      - "4090:4090"
    environment:
      DB_HOST: postgres_polardb15_vector_age_zh  # 使用 service name 或 container_name
      DB_PORT: "5432"
      DB_USER: langchain
      DB_PASSWORD: langchain
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # minio:
  #   image: minio/minio
  #   profiles: [minio]
  #   env_file:
  #     - ./env/minio.env
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: on-failure
  #   command: server /data --console-address ":9001"


# docker run --name jqai -p 4090:4090 -d jqai:v1.0.1


  hatchet-postgres:
    image: postgres:latest
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_postgres_data2:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet_user -d hatchet"]
      interval: 10s
      timeout: 5s
      retries: 5


  hatchet-rabbitmq:
    image: "rabbitmq:3-management"
    hostname: "hatchet-rabbitmq"
    ports:
      - "5673:5672"
      - "15673:15672"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_rabbitmq_data:/var/lib/rabbitmq
      - hatchet_rabbitmq_conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  hatchet-create-db:
    image: postgres:latest
    command: sh /scripts/create-hatchet-db.sh
    volumes:
      - ./scripts:/scripts
    env_file:
      - ./env/hatchet.env

  hatchet-migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.53.15
    env_file:
      - ./env/hatchet.env
    depends_on:
      hatchet-create-db:
        condition: service_completed_successfully

  hatchet-setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet-migration:
        condition: service_completed_successfully
      hatchet-rabbitmq:
        condition: service_healthy

  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.53.15
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    ports:
      - "7077:7077"
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8733/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.53.15
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully
    env_file:
      - ./env/hatchet.env
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    ports:
      - "7274:80"

  setup-token:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.53.15
    command: sh /scripts/setup-token.sh
    volumes:
      - ./scripts:/scripts
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
      - hatchet_api_key:/hatchet_api_key
    depends_on:
      hatchet-setup-config:
        condition: service_completed_successfully

  unstructured:
    image: ragtoriches/unst-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7275/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph_clustering:
    image: ragtoriches/cluster-prod
    ports:
      - "7276:7276"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7276/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  r2r:
    image: jqr2r365:latest
    ports:
      - "7272:7272"
    env_file:
      - ./env/r2r-full.env
    command: sh /scripts/start-r2r.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7272/v3/health"]
      interval: 6s
      timeout: 5s
      retries: 5
    restart: on-failure
    volumes:
      - /data/models/bce-embedding-base_v1:/data/models/bce-embedding-base_v1
      - /data/jqr2r/R2R/py:/app
      - /data/projects/JqChatV2/JqChat:/data/projects/JqChatV2/JqChat 
      - /data/projects/JqChatV2/JqChat/jqcode:/app/jqcode
      - /data/projects/JqChatV2/JqChat/.env:/app/.env
      - ./user_configs:/app/user_configs
      - ./user_tools:/app/user_tools
      - hatchet_api_key:/hatchet_api_key:ro
      - ./scripts:/scripts
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      setup-token:
        condition: service_completed_successfully
      unstructured:
        condition: service_healthy
      graph_clustering:
        condition: service_healthy

  r2r-dashboard:
    image: sciphiai/r2r-dashboard:1.0.3
    env_file:
      - ./env/r2r-dashboard.env
    ports:
      - "7273:3000"

