volumes:
  hatchet_certs:
    name: hatchet_certs
  hatchet_config:
    name: hatchet_config
  hatchet_api_key:
    name: hatchet_api_key
  hatchet_rabbitmq_data:
    name: hatchet_rabbitmq_data
  hatchet_rabbitmq_conf:
    name: hatchet_rabbitmq_conf
  hatchet_postgres_data2:
    name: hatchet_postgres_data
  minio_data:
    name: minio_data
  postgres_data2:
    name: postgres_data

services:
  # Redis 缓存服务
  redis:
    image: registry.ap-southeast-1.aliyuncs.com/fastbuildai/redis:8.0.2
    container_name: fastbuildai-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUICK_START_MODE: ${QUICK_START_MODE:-false}
    ports:
    - "32768:6379"
    #   - "${REDIS_EXTERNAL_PORT}${REDIS_EXTERNAL_PORT:+:}6379"
    volumes:
      - ./data/redis:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# postgres 数据库服务
    # # pg数据库目录挂载
    # # 确保目录存在
    # mkdir -p /data/pg_all_data/pgdata
    # mkdir -p /data/pg_all_data/polardb-data

    # # 设置权限（你已执行，再次确认）
    # chown -R 999:999 /data/pg_all_data/pgdata
    # chown -R 999:999 /data/pg_all_data/polardb-data
  postgres:
    image: polardb15_vector_age_zh:v1.2  # 注意：实际镜像名不是官方的 polardb/polardb_pg_local_instance:15，而是你本地构建的
    container_name: jq_postgres_polardb15_vector_age_zh_in_composed
    environment:
      POLARDB_PORT: "5432"
      POLARDB_USER: langchain
      POLARDB_PASSWORD: langchain
      POLARDB_DB: postgres
      POSTGRES_INITDB_ARGS: "--locale=zh_CN.utf8 --lc-collate=zh_CN.utf8 --lc-ctype=zh_CN.utf8 --encoding=UTF8"
      TZ: Asia/Shanghai
      # 添加这行，让容器内的进程也能知道密码
      PGPASSWORD: langchain # <--- 添加这行
      # PGHOST: 127.0.0.1
      # 其他环境变量如 PATH、LANG 等通常由镜像默认设置，无需显式声明
    ports:
      - "7001:5432"  # Host:Container
    cap_add:
      - SYS_PTRACE
    privileged: true
    security_opt:
      - label=disable
    volumes:
      - /data/pg_all_data/pgdata:/var/lib/postgresql/data  # bind mount for PG data
      - /data/pg_all_data/polardb-data:/var/polardb        # bind mount for PolarDB internal data
    working_dir: /home/postgres/
    user: postgres
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["postgres"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s  # PolarDB 启动较慢，建议增加启动等待时间

# Vue晶奇前端服务
  jqai:
    image: jqai:v1.0.0
    container_name: jq_ai_ui_in_composed
    ports:
      - "5090:4090"
    volumes:
      - /data/pg_all_data/jqaiui_storage:/code/apps/server/storage
    environment:
      DB_USER: langchain
      DB_PASSWORD: langchain
      DB_SCHEMA: fastbuildai
      DB_HOST: postgres          # ✅ 改为 Compose 服务名
      DB_PORT: "5432"            # ✅ 容器内端口，不是宿主机映射端口
      REDIS_HOST: redis          # ✅ 改为 redis 服务名
      REDIS_PORT: "6379"         # ✅ 容器内 Redis 端口
      # DB_HOST: 10.1.150.105
      # DB_PORT: "7001"
      # REDIS_HOST: 10.1.150.105
      # REDIS_PORT: "32768"
    depends_on:
      postgres:
        # condition: service_healthy # 注释掉这行
        condition: service_started  # 改为 service_started
      redis:
        condition: service_started
    restart: unless-stopped
  
  # 代码沙箱服务
  sandbox:
    container_name: jq_code_aio-sandbox_in_composed
    image: aio_sandbox_jq:v1.1
    entrypoint: ["sh"]
    command: ["/opt/gem/run.sh"]
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "unless-stopped"
    shm_size: "2gb"
    ports:
      - "${HOST_PORT:-9191}:8080"
    volumes:
      - /data/projects/JqChatV2/workspace:/data/projects/JqChatV2/workspace
      - /data/projects/JqChatV2/JqChat/.Fonts_CN/MSYH:/usr/share/fonts/truetype/msyh
    environment:
      PROXY_SERVER: ${PROXY_SERVER:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DNS_OVER_HTTPS_TEMPLATES: ${DNS_OVER_HTTPS_TEMPLATES:-}
      WORKSPACE: ${WORKSPACE:-"/home/gem"}
      HOMEPAGE: ${HOMEPAGE:-}
      BROWSER_EXTRA_ARGS: ${BROWSER_EXTRA_ARGS:-}
      TZ: ${TZ:-Asia/Singapore}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1280}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1024}
      WAIT_PORTS: "8079,8091"
      VNC_SERVER_PORT: 5900
      PUBLIC_PORT: 8080
      AUTH_BACKEND_PORT: 8081
      WEBSOCKET_PROXY_PORT: 6080
      GEM_SERVER_PORT: 8088
      MCP_HUB_PORT: 8079
      SANDBOX_SRV_PORT: 8091
      JUPYTER_LAB_PORT: 8888
      CODE_SERVER_PORT: 8200
      MCP_SERVER_BROWSER_PORT: 8100
      TINYPROXY_PORT: 8118
      MCP_SERVER_MARKITDOWN_PORT: 8101
      MCP_SERVER_CHROME_DEVTOOLS_PORT: 8102
      BROWSER_REMOTE_DEBUGGING_PORT: 9222
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
      # for gh cli
      GITHUB_TOKEN: ""

